# -----------------------------------------------
# Package org.phoebus.saveandrestore.util
# -----------------------------------------------

# Connection timeout, in milliseconds, when taking snapshot.
connectionTimeout=5000

# Write timeout, in milliseconds, when restoring snapshot.
writeTimeout=5000

# Restore policy: ASYNCHRONOUS (parallel PV writes) or SYNCHRONOUS
# (write one PV at a time). With channel access (ca), parallel writes
# may trigger deadlocks in the JCA library. SYNCHRONOUS policy
# is then the workaround to consider.
restorePolicy=SYNCHRONOUS
