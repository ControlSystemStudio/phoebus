logging.level.org.springframework=DEBUG
app.version=@project.version@
app.name=@project.artifactId@

# The server port for the rest service
server.port=8080

# Elasticsearch connection parameters
elasticsearch.network.host=localhost
elasticsearch.http.port=9200
elasticsearch.http.protocol=http

# The value for the `Authorization` header used in requests to the Elasticsearch server.
# This header supports token-based or API key-based authentication.
# See https://www.elastic.co/guide/en/elasticsearch/client/java-api-client/8.12/_other_authentication_methods.html
elasticsearch.authorization.header =

# Username and password for basic authentication with the Elasticsearch server.
# These credentials are only used if `elasticsearch.authorization.header` is not set.
elasticsearch.authorization.username =
elasticsearch.authorization.password =

server.servlet.contextPath=/save-restore

# The names of the index to use for save&restore
elasticsearch.tree_node.index=saveandrestore_tree
elasticsearch.configuration_node.index=saveandrestore_configuration
elasticsearch.snapshot_node.index=saveandrestore_snapshot
elasticsearch.composite_snapshot_node.index=saveandrestore_composite_snapshot
elasticsearch.filter.index=saveandrestore_filter

############################## REST Logging ###############################
# DEBUG level will log all requests and responses to and from the REST end points
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# Mapping of static resources. Needed as otherwise the web front-end (if present) will intercept and fail to
# serve a resource like for instance SearchHelp.html
spring.mvc.static-path-pattern=/**

###### Bypass authorization (but not authentication!) #######
authorization.permitall = true

############## Authorization Roles ################
role.user=sar-user
role.admin=sar-admin

############## EPICS related #################
connection.timeout=5000
write.timout=5000

########### Spring Boot Actuator Configuration #############
# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,loggers,env

# Base path for actuator endpoints (default is /actuator)
# management.endpoints.web.base-path=/actuator

# Enable info endpoint
management.info.env.enabled=true

# Resources for the authentication providers that need it
embeddedLdapPropertySource=classpath:/security/embedded_ldap.properties
ldapPropertySource=classpath:/security/ldap.properties
activeDirectoryPropertySource=classpath:/security/active_directory.properties
inMemoryPropertySource=classpath:/security/in_memory.properties

########### Wanted authentication providers #############
# This is a comma separated list of wanted authentication providers
# Supported values:
# inMemory - in memory, hard coded username/password
# ldap - e.g. external OpenLDAP
# embeddedLdap - embedded LDAP
# activeDirectory - Active Directory
authenticationProviders=inMemory
