name: Merge to master

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      from-ref: ${{ github.event.before }}
      to-ref: ${{ github.sha }}
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      upload-artifacts: true
      # Linux aarch64 is not yet a supported platform; report but tolerate failures
      allow-failure: ${{ startsWith(matrix.os, 'ubuntu-') && endsWith(matrix.os, '-arm') }}
  unit-test:
    uses: ./.github/workflows/_unit-test.yml
  ui-test:
    uses: ./.github/workflows/_ui-test.yml
  integration-test:
    uses: ./.github/workflows/_integration-test.yml

  docker-image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [alarm-server, alarm-logger, save-and-restore, scan-server]
    uses: ./.github/workflows/_docker-image.yml
    with:
      image-suffix: service-${{ matrix.service }}
      context: services/${{ matrix.service }}
      maven-args: ${{ matrix.service == 'scan-server' && '-Pexecutable-jar --update-snapshots package' || '--update-snapshots package' }}
