name: Test

on:
  workflow_call:
    inputs:
      name:
        description: Name used for the uploaded report artifact.
        type: string
        required: true
      run:
        description: Command that runs the tests.
        type: string
        required: true
      report-path:
        description: Glob for the test reports to upload.
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Java
      uses: ./.github/actions/setup-java
    - name: Test
      run: $TEST_COMMAND
      env:
        TEST_COMMAND: ${{ inputs.run }}
    - name: Upload test reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: ${{ inputs.name }}-reports
        path: ${{ inputs.report-path }}
        if-no-files-found: ignore
