name: Test report

on:
  # Reports must run with write permissions that PRs from forks cannot grant,
  # so they are published from a separate workflow_run-triggered workflow. The
  # job only downloads artifacts and posts reports; it never runs PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - PR
      - Merge to master
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download test report artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: '*test-reports'
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    - name: Publish test report
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: '**/TEST-*.xml'
        commit: ${{ github.event.workflow_run.head_sha }}
